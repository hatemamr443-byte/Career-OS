services:
  - type: web
    name: career-os-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: career-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: career-os-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  - type: redis
    name: career-os-redis
    ipAllowList: []

databases:
  - name: career-os-db
    databaseName: career_os
    user: career_os
